# CLI Configuration for Ki-Knowledge
# Define the command hierarchy here - it will be auto-loaded by the CLI framework

cli:
  # Top-level commands and groups
  commands:
    infosite:
      help: "Knowledge Presentation (Infosite) Management"
      commands:
        init:
          help: "Initialize a new infosite project"
          callback: "ki_knowledge.cli.commands.infosite:init_project"
        generate:
          help: "Generate infosite from source documents"
          callback: "ki_knowledge.cli.commands.infosite:generate_infosite"
        list:
          help: "List infosite projects"
          callback: "ki_knowledge.cli.commands.infosite:list_projects"
        discover:
          help: "Discover source documents"
          callback: "ki_knowledge.cli.commands.infosite:discover_documents"

    knowledge:
      help: "Knowledge Base Management"
      commands:
        import:
          help: "Import knowledge documents (PDF, Markdown, etc)"
        search:
          help: "Search knowledge base"
        graph:
          help: "Visualize knowledge graph"

    nextcloud:
      help: "Nextcloud WebDAV storage (input import, create-only output upload)"
      commands:
        status:
          help: "Show resolved Nextcloud settings (no network)"
          callback: "ki_knowledge.cli.commands.nextcloud:status"
        list:
          help: "List a folder below the domain input root"
          callback: "ki_knowledge.cli.commands.nextcloud:list_remote"
        download:
          help: "Download a file into the local input cache"
          callback: "ki_knowledge.cli.commands.nextcloud:download"
        import:
          help: "Import Markdown from the domain input root"
          callback: "ki_knowledge.cli.commands.nextcloud:import_remote"
        upload:
          help: "Upload a generated output file (never overwrites)"
          callback: "ki_knowledge.cli.commands.nextcloud:upload"

    dev:
      help: "Development Tools"
      commands:
        django:
          help: "Django Development Server"
          commands:
            start:
              help: "Start Django development server"
              callback: "ki_knowledge.cli.commands.dev:django_start"
            stop:
              help: "Stop Django development server"
              callback: "ki_knowledge.cli.commands.dev:django_stop"
            migrate:
              help: "Run Django migrations"
              callback: "ki_knowledge.cli.commands.dev:django_migrate"
            shell:
              help: "Open Django shell"
              callback: "ki_knowledge.cli.commands.dev:django_shell"
            createsuperuser:
              help: "Create Django superuser"
              callback: "ki_knowledge.cli.commands.dev:django_createsuperuser"
        test:
          help: "Run tests"
          callback: "ki_knowledge.cli.commands.dev:run_tests"
        lint:
          help: "Run linter (ruff)"
          callback: "ki_knowledge.cli.commands.dev:run_lint"

    config:
      help: "Config Management (from ki-core)"
      commands:
        resolve:
          help: "Resolve and display full config"
          callback: "ki_knowledge.cli.commands.config:run_config"
        skeleton:
          help: "Generate config skeleton"
          callback: "ki_knowledge.cli.commands.config:run_skeleton"
        show:
          help: "Show config or specific key"
          callback: "ki_knowledge.cli.commands.config:run_show"
        verify:
          help: "Verify config against schema"
          callback: "ki_knowledge.cli.commands.config:run_verify"

    profile:
      help: "Profile Management (from ki-core)"
      commands:
        list:
          help: "List available profiles"
          callback: "ki_knowledge.cli.commands.profile:run_list"
        set:
          help: "Set active profile"
          callback: "ki_knowledge.cli.commands.profile:run_set"
        active:
          help: "Show active profile"
          callback: "ki_knowledge.cli.commands.profile:run_active"

    stage:
      help: "Stage Management (from ki-core)"
      commands:
        list:
          help: "List available stages"
          callback: "ki_knowledge.cli.commands.stage:run_list"
        set:
          help: "Set active stage"
          callback: "ki_knowledge.cli.commands.stage:run_set"
        active:
          help: "Show active stage"
          callback: "ki_knowledge.cli.commands.stage:run_active"
