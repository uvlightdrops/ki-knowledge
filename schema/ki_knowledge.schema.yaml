$schema: "http://json-schema.org/draft-07/schema#"
title: "ki-knowledge Configuration"
description: "Application-specific schema for ki-knowledge. Merged on top of ki-core's generic base schema (llm, http, creds)."
type: object
properties:
  knowledge:
    type: object
    title: "Knowledge Base Settings"
    properties:
      data_root:
        type: string
        default: ""
        description: "Root directory for knowledge base data"
      cache_db:
        type: string
        default: ""
        description: "Path to the knowledge cache database"
      graph_db:
        type: string
        default: ""
        description: "Path to the knowledge graph database"
      embed_model:
        type: string
        default: "nomic-embed-text"
        description: "Embedding model used for semantic search"
      default_domain:
        type: string
        default: "default"
      paths:
        type: object
        properties:
          markdown_root:
            type: string
            default: ""
          jira_root:
            type: string
            default: ""
          ontology_root:
            type: string
            default: ""
          pdf_root:
            type: string
            default: ""
        additionalProperties: true
    additionalProperties: true
  jira:
    type: object
    title: "Jira Integration Settings"
    properties:
      url:
        type: string
        default: ""
      username:
        type: string
        default: ""
      api_token:
        type: string
        default: ""
      csv_path:
        type: string
        default: ""
      cache_db:
        type: string
        default: ""
      graph_db:
        type: string
        default: ""
      graph_cypher_path:
        type: string
        default: ""
      csv_delimiter:
        type: string
        default: ","
      csv_encoding:
        type: string
        default: "utf-8"
      timeline_days:
        type: integer
        default: 90
      embed_model:
        type: string
        default: "nomic-embed-text"
      use_hybrid_search:
        type: boolean
        default: true
      use_graph:
        type: boolean
        default: false
      cache_refresh:
        type: boolean
        default: false
    additionalProperties: true
  infosite:
    type: object
    title: "InfoSite Settings"
    properties:
      enabled:
        type: boolean
        default: false
      title:
        type: string
        default: ""
      output_base_dir:
        type: string
        default: ""
      domain:
        type: string
        default: "default"
    additionalProperties: true
  apps:
    type: object
    properties:
      ki_knowledge:
        type: object
        title: "ki-knowledge App Settings"
        properties:
          api_url:
            type: string
            default: ""
          distributed:
            type: object
            title: "Distributed Collaboration Settings"
            properties:
              enabled:
                type: boolean
                default: false
              node_id:
                type: string
                default: ""
              node_role:
                type: string
                default: "standalone"
              master_url:
                type: string
                default: ""
              sync_on_connect:
                type: boolean
                default: true
              postgres_dsn:
                type: string
                default: ""
              sync_shared_secret:
                type: string
                default: ""
              public_url:
                type: string
                default: ""
                description: Own reachable URL of this node (announced in heartbeats); on hosts base_url is the master URL
              federation_id:
                type: string
                default: "default"
            additionalProperties: true
          nextcloud:
            type: object
            title: "Nextcloud WebDAV Storage"
            description: >-
              Direct WebDAV access to one Nextcloud user. Input roots are listed/downloaded/imported,
              output roots receive generated files (create-only). app_password belongs in creds.yaml.
            properties:
              enabled:
                type: boolean
                default: false
              base_url:
                type: string
                default: ""
                description: "https://cloud.example.org (optionally with sub path, no credentials)"
              username:
                type: string
                default: ""
              app_password:
                type: string
                default: ""
                description: Nextcloud app password; set only in creds.yaml
              user_id:
                type: string
                default: ""
                description: Nextcloud user id in DAV URLs if it differs from the login name
              dav_path:
                type: string
                default: "remote.php/dav/files/{user_id}"
              timeout_seconds:
                type: number
                default: 30
              max_download_bytes:
                type: integer
                default: 52428800
              max_download_seconds:
                type: number
                default: 300
              max_listing_bytes:
                type: integer
                default: 5242880
              max_upload_bytes:
                type: integer
                default: 52428800
              allow_insecure_http_loopback:
                type: boolean
                default: false
                description: Allow plain http only for loopback hosts (tests)
              ca_bundle:
                type: string
                default: ""
                description: Optional CA bundle file; TLS verification is always on
              domains:
                type: object
                default: {}
                description: "<domain>: {input_root, output_root} paths below the user's files root; must not overlap"
                additionalProperties:
                  type: object
                  properties:
                    input_root:
                      type: string
                    output_root:
                      type: string
                  additionalProperties: false
            additionalProperties: false
          django:
            type: object
            properties:
              db_path:
                type: string
                default: ""
              secret_key:
                type: string
                default: ""
              debug:
                type: boolean
                default: false
              allowed_hosts:
                type: array
                items:
                  type: string
                default: []
              wagtail_admin_base_url:
                type: string
                default: ""
            additionalProperties: true
        additionalProperties: true
    additionalProperties: true
additionalProperties: true
