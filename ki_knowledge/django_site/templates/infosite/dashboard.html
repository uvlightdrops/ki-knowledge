{% extends "base.html" %}
{% load static %}

{% block title %}Infosite Dashboard{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'infosite/css/dashboard.css' %}">
{% endblock %}

{% block content %}
<div class="section">
  <h1>📚 Knowledge Presentation (Infosite)</h1>
  <div class="grid">
    {% for card in widget_cards %}
      <section class="card" style="grid-column: span {{ card.width|default:6 }};">
        <h3>{{ card.label }}</h3>
        {{ card.body|safe }}
      </section>
    {% endfor %}
  </div>
</div>
{% endblock %}
