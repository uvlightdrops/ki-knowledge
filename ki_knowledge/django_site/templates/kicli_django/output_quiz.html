{% extends "base.html" %}
{% block title %}Quiz (geplant) · Info Output · KICLI{% endblock %}
{% block content %}
  <h1>📝 Quiz <span class="chip">geplant</span></h1>
  <div class="widgetkit-grid--12">
    {% for card in widget_cards %}
      <section class="card widgetkit-grid__item" style="--widgetkit-width: {{ card.width|default:6 }};">
        <h3>{{ card.label }}</h3>
        {{ card.body|safe }}
      </section>
    {% endfor %}
  </div>
{% endblock %}
