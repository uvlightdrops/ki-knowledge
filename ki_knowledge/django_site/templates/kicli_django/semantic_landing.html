{% extends "base.html" %}
{% block title %}Semantic · KICLI{% endblock %}
{% block content %}
  <h1>Semantic</h1>
  <div class="grid">
    {% for card in widget_cards %}
      <section class="card" style="grid-column: span {{ card.width|default:6 }};">
        <h3>{{ card.label }}</h3>
        {{ card.body|safe }}
      </section>
    {% endfor %}
  </div>
{% endblock %}
