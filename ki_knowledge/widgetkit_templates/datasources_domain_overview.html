<table><thead><tr><th>Domain</th><th>Sources</th><th>Records</th><th>InfoSites</th><th>Files</th></tr></thead><tbody>
{% for domain in all_domains %}
<tr>
  <td><strong>{{ domain.display_name }}</strong></td>
  <td>{{ domain.knowledge_sources }}</td>
  <td>{{ domain.knowledge_records }}</td>
  <td>{{ domain.infosite_project_count }}</td>
  <td>{{ domain.infosite_source_count }}</td>
</tr>
{% endfor %}
</tbody></table>
