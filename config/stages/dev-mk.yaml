# Inside minikube (pods get KI_STAGE=dev-mk). DSN, Ollama URL and data root
# come from stack.k8s.env; chat + embeddings via the in-cluster Ollama
# (http://ollama:11434, models persist on the ollama-models PVC).
llm:
  default_provider: ollama
apps:
  ki_knowledge:
    django:
      debug: false
      allowed_hosts: ["*"]
