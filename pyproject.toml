[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ki-knowledge"
version = "0.1.0"
description = "Knowledge Base System with Graph and Ingestion"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "KI Team"}]

dependencies = [
    "Django>=4.2",
    "elasticsearch>=8.0",
    "pypdf>=3.0",
    "ki-core",  # sibling repo, installed by ./kistack install
    "widgetkit-django",  # sibling repo, installed by ./kistack install
    "yaml-cfg-wizard>=0.1.0",
    "requests>=2.31.0",
    "PyYAML>=6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "networkx>=3.2",
    "pyvis>=0.3.2",
    "rdflib>=7.0.0",
    "markdown>=3.6",
    "python-dotenv>=1.0.0",
    "wagtail>=7.0",
    "odfpy>=1.4",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.27.0",
    "pip-audit>=2.7.0",
]
widgetkit = ["Jinja2>=3.1"]
audit = ["pip-audit>=2.7.0"]
# shared node contracts with ia3simworld (not on PyPI yet; dev: pip install -e ../ia3simworld/packages/ki-node-core)
node = ["ki-node-core>=0.1.0a1"]

[project.scripts]
kictl = "ki_knowledge.cli.main:main"

[tool.setuptools]
packages = ["ki_knowledge"]

[tool.stackctl]
# ./kistack -> stackctl: stack spec = section "stack" of the ki-core config
# (config/defaults/stack.yaml + active stage), see doc/DJANGO_DEV.md
config_loader = "ki_core:load_config"
config_key = "stack"

[[tool.stackctl.siblings]]
name = "yaml_cfg_wizard"
url = "https://github.com/uvlightdrops/yaml-cfg-wizard.git"
branch = "devel"

[[tool.stackctl.siblings]]
name = "ki-core"
url = "https://github.com/uvlightdrops/ki-core.git"
branch = "master"

[[tool.stackctl.siblings]]
name = "widgetkit-django"
url = "https://github.com/uvlightdrops/widgetkit-django.git"
branch = "devel"
